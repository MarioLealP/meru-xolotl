# Xolotl's fence: where its Application may read from and deploy to - its own repo plus the
# Nüwa and Sindri charts, into exactly its namespaces - the app's, its build's and its environments' (D126) - which it may also create. Written by Shikigami (D82).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: meru-xolotl
  namespace: argocd
spec:
  description: "Xolotl - Meru's merger - checks and merges Shikigami's trust PRs"
  sourceRepos:
    - https://git.clockmost.com/Meru/xolotl.git
    - https://git.clockmost.com/Meru/nuwa.git
    - https://git.clockmost.com/Meru/sindri.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: xolotl
    - server: https://kubernetes.default.svc
      namespace: xolotl-build
    - server: https://kubernetes.default.svc
      namespace: xolotl-uat
    - server: https://kubernetes.default.svc
      namespace: xolotl-prod
  clusterResourceWhitelist:
    - { group: "", kind: Namespace, name: xolotl }
    - { group: "", kind: Namespace, name: xolotl-build }
    - { group: "", kind: Namespace, name: xolotl-uat }
    - { group: "", kind: Namespace, name: xolotl-prod }
