# xolotl's deployment, rendered by Argo CD with Meru's nuwa-app chart. Shikigami fills in what comes from the
# request (owner, size, route) and adds deploy/meru.yaml - the marker that makes Meru deploy this repo - once the
# app's namespace fence, signing key and build credentials exist. CI writes the image after each build; until the
# first one the digest is a placeholder: nuwa-app renders everything but the workload (the build runner comes up, no
# pod waits on an image that doesn't exist yet).
name: xolotl
owner: mario
image:
  repository: zot.clockmost.com/meru/xolotl
  digest: sha256:984753d9c54f9bfefbf3759ba2d982828e8d5c2fa706ab1fcca7fd5e534a683a
  tag: "cadfd5f13094"
# Its Gitea bot's token (meru-xolotl-identities.sh -> apps/meru/xolotl/eso/gitea): merging and commenting on trust
# PRs, reading Meru/requests. Without it Xolotl only checks and logs.
# And the xolotl-approvals app's client secret (meru-oidc-secret.sh -> apps/meru/xolotl/eso/approvals-oidc): redeeming
# Mario's approval codes (D98). Without it /approve answers 503.
secretEnv:
  XOLOTL_GITEA_TOKEN:
    secret: gitea
    key: token
  XOLOTL_APPROVALS_CLIENT_SECRET:
    secret: approvals-oidc
    key: clientSecret
externalSecrets:
  gitea: {}
  approvals-oidc: {}
# Who may connect (D97): the host side - Caddy, Gitea and Zabbix are still Docker containers, so their addresses,
# plus the node for the kubelet's probes - Shikigami (/ping, "trust PRs opened") and Janus (/approve, D98).
# Everything else in the cluster is refused. When Caddy and Gitea move into the cluster (D24) the Docker range goes
# for their namespaces.
networkPolicy:
  enabled: true
  fromNamespaces: [janus, shikigami]
