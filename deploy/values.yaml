# xolotl's deployment, rendered by Argo CD with Meru's nuwa-app chart. Shikigami fills in what comes from the
# request (owner, size, route) and adds deploy/meru.yaml - the marker that makes Meru deploy this repo - once the
# app's namespace fence, signing key and build credentials exist. CI writes the image after each build; until the
# first one the digest is a placeholder: nuwa-app renders everything but the workload (the build runner comes up, no
# pod waits on an image that doesn't exist yet).
name: xolotl
owner: mario
image:
  repository: zot.clockmost.com/meru/xolotl
  digest: sha256:9a4341e1afa9cb9430ea584cdc3e7e3f25583ae2f5516f8d5c337506c5f0e0b5
  tag: "f7767222b823"
# Its Gitea bot's token (meru-xolotl-identities.sh -> apps/meru/xolotl/eso/gitea): merging and commenting on trust
# PRs, reading Meru/requests. Without it Xolotl only checks and logs.
secretEnv:
  XOLOTL_GITEA_TOKEN:
    secret: gitea
    key: token
externalSecrets:
  gitea: {}
