[project]
name = "xolotl"
version = "0.1.0"
description = "Meru's merger - checks and merges Shikigami's trust PRs"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "ty>=0.0.95",
    "types-pyyaml>=6.0.12.20261030",
]

[tool.uv]
package = false # an app, not a library: the code runs from src/

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ty.environment]
extra-paths = ["src"]
