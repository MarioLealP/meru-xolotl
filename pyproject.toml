[project]
name = "xolotl"
version = "0.1.0"
description = "Meru's merger - checks and merges Shikigami's trust PRs"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.uv]
package = false # an app, not a library: the code runs from src/

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ty.environment]
extra-paths = ["src"]
